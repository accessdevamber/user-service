spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/ecom_user_db?useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate #match schema in db and entity/class via hibernate
    show-sql: true #show sql query on console
    properties:
      hibernate:
        #dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true #show formatted sql query on console

  flyway:
    enabled: true
    #baseline-on-migrate: true -> not required for our new ecom_user_db, needed for old projects which are adding new flyway
    locations: classpath:db/migration

    #    Flyway will create the table — NOT Hibernate.
    #    Because Flyway runs before Hibernate during startup.
    #
    #    👉 Hibernate will see the table already existing and will not try to recreate or drop it, even if ddl-auto=update.

#    baseline-on-migrate: true is not required for our new ecom_user_db, which is why I left it out.
#
#    What does it mean?
#
#    Suppose you already have an existing database with tables/data, but Flyway was never used before:
#
#    ecom_user_db
#    │
#    ├── users
#    ├── addresses
#    ├── orders
#    │
#    └── ❌ no flyway_schema_history
#
#    Now you introduce Flyway.
#
#    Flyway sees:
#
#    This database isn't empty, but I have no migration history for it. I don't know how this schema got here.
#
#    Normally Flyway protects you by refusing to migrate a non-empty schema without a history table.
#
#    If you configure:
#
#    spring:
#      flyway:
#        baseline-on-migrate: true
#
#    you're basically telling Flyway:
#
#    "This existing database/schema is my starting baseline. Start managing migrations from here."
#
#    Flyway can then create its history table and establish a baseline instead of failing because the schema was already populated.
#
#    Our project is different
#
#    We're starting fresh:
#
#    CREATE DATABASE ecom_user_db;
#
#    It's empty:
#
#    ecom_user_db
#    └── nothing
#
#    Then we start Spring Boot:
#
#    Empty DB
#    ↓
#    Flyway
#    ↓
#    V1__create_users_table.sql
#    ↓
#    users created
#    ↓
#    flyway_schema_history created
#
#    So simply:
#
#    spring:
#      flyway:
#        enabled: true
#        locations: classpath:db/migration
#
#    is enough.
#
#    Easy rule to remember
#    NEW EMPTY DATABASE
#    ↓
#    baseline-on-migrate: NOT needed
#
#
#    EXISTING NON-EMPTY DATABASE
#    that was NOT previously managed by Flyway
#    ↓
#    baseline-on-migrate: true
#    can be useful
#
#    Also, I wouldn't enable it everywhere by default. baseline-on-migrate removes one of Flyway's safety checks,
#    so it's better to use it intentionally when adopting Flyway for an existing schema.
#
#    For our new portfolio e-commerce project, leave it out.
server:
  port: 9090
