name: Build and Push Docker Image with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/maven.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.5

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecom_user_db

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    permissions:
      contents: read
      #contents: write  # Required to push back to repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # Don't use GITHUB_TOKEN

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        env:
          DB_URL: jdbc:mysql://localhost:3306/ecom_user_db
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./mvnw clean package #The ./ means execute the mvnw file from the current directory.
        #run: mvn clean install

      # 4. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Convert full Git SHA into short 7-character SHA
      - name: Generate short commit SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      # 6. Build Docker image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:${{ env.SHORT_SHA }} .
        #run: docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-cicd:latest .

      # 7. Push Docker image to Docker Hub
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-service:${{ env.SHORT_SHA }}
        #run: docker push ${{ secrets.DOCKER_USERNAME }}/spring-cicd:latest

